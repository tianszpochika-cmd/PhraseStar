packages:
  - apps/*
  - services/*
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - vue-demi

publicHoistPattern:
  # Vite 8 bundles with Rolldown and the uni-app plugin pins preserveSymlinks: true
  # (see @dcloudio/vite-plugin-uni/dist/config/resolve.js), so module ids stay on the
  # symlinked path (apps/mobile/node_modules/pinia/dist/pinia.mjs) instead of the real
  # store path. pinia's own runtime dependencies are therefore not resolvable under
  # pnpm's isolated layout. These are exactly pinia 2.3.1's runtime dependencies other
  # than vue; hoisting only them keeps every other package isolated.
  - '*vue-demi*'
  - '*@vue/devtools-api*'

overrides:
  # Moved here from package.json#pnpm.overrides during the P1R-M0-006 route-3 migration. This is a
  # relocation, not a repair: the pins were in effect before the move, because the pre-migration
  # pnpm-lock.yaml carried an overrides: section with exactly these entries. pnpm 10 reads the
  # workspace file as the recommended location, so the pins now live in one workspace-level file
  # rather than in one project's manifest, and nothing was ever silently ignored.
  #
  # Verify by reading the resolved versions out of pnpm-lock.yaml. Do not use
  # `pnpm config get overrides`: it reports only the workspace-file source and returns undefined for
  # overrides coming from package.json, even while those overrides are in effect.
  express>path-to-regexp: 0.1.13
  '@dcloudio/uni-nvue-styler>postcss': 8.5.23
  # adm-zip 0.6.0 was the affected upper bound for GHSA-xcpc-8q44-7q3c; 0.6.1 is published and
  # outside it. Raised from 0.6.0 on 2026-09-13.
  '@dcloudio/uni-cli-shared>adm-zip': 0.6.1
  '@dcloudio/uni-cli-shared>@intlify/core-base': 9.1.11
  '@intlify/message-resolver': 9.1.11
  # GHSA-w27v-7q3p-w38r (high) / GHSA-4vpr-x523-8j87 (moderate): svgo < 4.1.0 lets
  # removeScripts be bypassed. Reached in production through
  # official-site > nuxt > @nuxt/vite-builder > cssnano > postcss-svgo.
  svgo: '>=4.1.0'
  # 2026-11-07 security pins. The six overrides above stay.
  # Distinct majors use their own version selector. There is no minimatch>brace-expansion pin.
  '@dcloudio/uni-uts-v1>adm-zip': 0.6.1
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=5.0.0 <6.0.0': 5.0.12
  'devalue@>=5.9.0 <6.0.0': 5.9.4
  'listhen>node-forge': 1.4.3
  '@nuxt/vite-builder>seroval': 1.6.12
  'source-map-js': 1.2.2
  'express>proxy-addr': 2.0.8
  'express>body-parser': 1.20.9
  'launch-editor>shell-quote': 1.12.0
  # nuxt@3.21.11 depends on @nuxt/devtools ^3.4.1. 3.4.4 publishes no simple-git
  # dependency. simple-git@4.0.1 still depends on @simple-git/argv-parser@2.0.0,
  # so those major overrides are not applied.
  'nuxt>@nuxt/devtools': 3.4.4
  '@nuxt/devtools>launch-editor': 2.14.2
  # Vite 6 and Vite 8 stay on their own lines. Vite 8.2.2 remains the uni-app exact peer.
  # Parent selector only. A vite@>=7 <8 selector rewrote multi-major peer ranges
  # (plugin-vue 6, devtools, unplugin) to exact 7.3.7 and mismatched Vite 8.
  '@nuxt/vite-builder>vite': 7.3.7
  # Vue 3.5.45 is the current stable 3.5 release and pulls matching @vue packages.
  # The uni-app 3.4.21 renderer has no 3.4 fix, so its compiler siblings move with it.
  'vue@3.5.41': 3.5.45
  '@vue/server-renderer@3.4.21': 3.5.45
  '@vue/server-renderer@3.5.41': 3.5.45
  '@vue/compiler-core@3.4.21': 3.5.45
  '@vue/compiler-core@3.5.41': 3.5.45
  '@vue/compiler-dom@3.4.21': 3.5.45
  '@vue/compiler-dom@3.5.41': 3.5.45
  '@vue/compiler-sfc@3.4.21': 3.5.45
  '@vue/compiler-sfc@3.5.41': 3.5.45
  '@vue/compiler-ssr@3.4.21': 3.5.45
  '@vue/compiler-ssr@3.5.41': 3.5.45
  '@vue/shared@3.4.21': 3.5.45
  '@vue/shared@3.5.41': 3.5.45
  '@vue/runtime-core@3.5.41': 3.5.45
  '@vue/runtime-dom@3.5.41': 3.5.45
  '@vue/reactivity@3.5.41': 3.5.45
